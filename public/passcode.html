<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%231A365D' /><path d='M30 25 V55 C30 65 35 75 50 75 C65 75 70 65 70 55 V25 H60 V55 C60 62 58 65 50 65 C42 65 40 62 40 55 V25 H30Z' fill='white' /><rect x='25' y='25' width='15' height='5' fill='white' /><rect x='60' y='25' width='15' height='5' fill='white' /></svg>">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Passcode Input</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, sans-serif;
      background: linear-gradient(to bottom, #fafafa, #f3f4f6);
    }
    .card {
      background: white;
      border-radius: 1rem;
      padding: 2rem;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      border: 1px solid #e5e7eb;
    }
    .input-field {
      width: 100%;
      position: relative;
      right: 12px;
      padding: 1rem;
      margin-top: 10px;
      border-radius: 0.75rem;
      border: 1px solid #d1d5db;
      font-size: 1.125rem;
      letter-spacing: 0.1em;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .input-field:focus {
      border-color: #9ca3af;
      box-shadow: 0 0 0 4px rgba(156, 163, 175, 0.3);
    }
    .pass-input-wrap {
      position: relative;
      width: 100%;
      margin-top: 10px;
      box-sizing: border-box;
    }
    .pass-input-wrap input {
      margin-top: 0 !important;
      padding-right: 48px !important;
      box-sizing: border-box;
    }
    .pass-input-wrap .toggle-password-btn {
      position: absolute;
      right: 0px;
      top: 50%;
      transform: translateY(-50%);
      background: transparent;
      border: none;
      padding: 0;
      margin: 0;
      width: 32px;
      height: 32px;
      cursor: pointer;
      color: #6b7280;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .pass-input-wrap .toggle-password-btn:hover {
      color: #111827;
    }
    .btn {
      margin-top: 1rem;
      width: 100%;
      padding: 0.75rem;
      border: none;
      border-radius: 0.75rem;
      background: #111827;
      color: white;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #1f2937;
    }
    .note {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.875rem;
      color: #6b7280;
    }
.back-btn-fixed {
  position: fixed;
  top: 16px;
  left: 16px;
  z-index: 9999;

  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font-size: 14px;
  font-weight: 600;
  border-radius: 8px;
  border: 1px solid var(--light, #EEEEEE);
  background: #4AC3C7;
  color: #ffffff;
  cursor: pointer;
  transition: background 0.2s;
  box-shadow: 0 3px 8px rgba(0,0,0,0.12);
}

.back-btn-fixed:hover {
  background: #ffffff;
  color: #1E6F74;
}
  </style>
</head>
<body>
  <div class="card">
    <input id="candidateID" class="input-field" type="text" placeholder="Enter your Candidate ID" autofocus/>
    <div class="pass-input-wrap">
      <input id="passcode" class="input-field" type="password" placeholder="Enter passcode"  />
      <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility('passcode', this)" title="Show passcode">
        <svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
      </button>
    </div>
    <button id="submitBtn" class="btn">Submit</button>
    
  </div>

  <!-- Back Button Template -->
<button class="back-btn-fixed">← Back</button>

  <script>
    const EYE_OPEN_SVG = `<svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const EYE_OFF_SVG = `<svg viewBox="0 0 24 24" width="22" height="22" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round" style="pointer-events:none;"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      if (!input) return;
      if (input.type === "password") {
        input.type = "text";
        if (btn) {
          btn.innerHTML = EYE_OFF_SVG;
          btn.title = "Hide passcode";
        }
      } else {
        input.type = "password";
        if (btn) {
          btn.innerHTML = EYE_OPEN_SVG;
          btn.title = "Show passcode";
        }
      }
    }
    // Get the query string (e.g., "?mockID=Academic-UKA-FINAL-3")
const queryString = window.location.search;

// Parse the parameters
const urlParams = new URLSearchParams(queryString);

// Get the specific value
const mockID = urlParams.get('mockID');

console.log(mockID); // Output: "Academic-UKA-FINAL-3"
    // Smart Paste: Paste "CandidateID Passcode" into Candidate ID box splits automatically
    const candInput = document.getElementById("candidateID");
    const passInput = document.getElementById("passcode");

    function handleSmartPaste(pasteText, e) {
      if (!pasteText) return false;
      const trimmed = pasteText.trim();
      // Match candidateID and passcode separated by whitespace (space, tab, newline)
      const match = trimmed.match(/^(\S+)[\s\t\n\r]+(\S+)$/);
      if (match) {
        if (e) e.preventDefault();
        candInput.value = match[1].trim();
        passInput.value = match[2].trim();
        passInput.focus();
        return true;
      }
      return false;
    }

    candInput.addEventListener("paste", (e) => {
      const pasteText = (e.clipboardData || window.clipboardData).getData("text");
      handleSmartPaste(pasteText, e);
    });

    passInput.addEventListener("paste", (e) => {
      const pasteText = (e.clipboardData || window.clipboardData).getData("text");
      // If paste contains both (separated by whitespace), populate both
      if (pasteText && pasteText.trim().match(/\s/)) {
        handleSmartPaste(pasteText, e);
      }
    });

    document.getElementById("submitBtn").addEventListener("click", async () => {
      const candidateID = document.getElementById("candidateID").value.trim();
      const passcode = document.getElementById("passcode").value.trim();
      
      if (!candidateID || !passcode) {
        alert("Please enter both Candidate ID and Passcode!");
        return;
      }

      try {
        const response = await fetch("/api/submit-passcode", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({ candidateID, passcode, mockID })
        });

        if (response.redirected) {
          window.location.href = response.url;
          return;
        }

        if (response.ok) {
          window.location.href = "/mock-test";
          return;
        }

        const errText = await response.text();
        if (response.status === 403 || errText.includes("PREMIUM")) {
          alert("⚠️ This mock test requires a PREMIUM Passcode!\n\nYour passcode is a Free Passcode, which is valid for Academic or General Mock Tests. Please use a Premium Passcode or select an Academic/General mock test.");
        } else if (errText.includes("ALREADY BEEN USED")) {
          alert("⚠️ This Passcode has ALREADY been used!\n\nPasscodes are one-time use only. Please contact admin for a new passcode.");
        } else if (errText.includes("INVALID CANDIDATE OR PASSCODE")) {
          alert("❌ Invalid Candidate ID or Passcode! Please verify and try again.");
        } else {
          alert("⚠️ " + (errText || "Wrong PASSCODE or CANDIDATE ID!"));
        }
      } catch (error) {
        console.error("Error:", error);
        alert("An error occurred during submission.");
      }
    });

  const backBtn = document.querySelector('.back-btn-fixed');
  if(backBtn){
    backBtn.addEventListener('click', () => {
      if(history.length > 1){
        history.back();
      } else {
        window.location.href = '/'; // fallback homepage
      }
    });
  }
  </script>
</body>
</html>

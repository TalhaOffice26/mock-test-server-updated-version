<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mock Test Launcher</title>
  <style>
    :root {
      --primary: #3B1E54;
      --secondary: #9B7EBD;
      --accent: #D4BEE4;
      --base: #EEEEEE;
      --text-dark: #1a1a1a;
      --text-light: #f9f9f9;
      --transition: 0.6s ease;
    }

    [data-theme="dark"] {
      --base: #1e1e2f;
      --text-dark: #f9f9f9;
      --text-light: #1a1a1a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Poppins', sans-serif;
      background: var(--base);
      color: var(--text-dark);
      overflow: hidden;
      transition: background var(--transition), color var(--transition);
    }

    .center {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    /* Welcome Screen */
    #welcome {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      background: linear-gradient(135deg, var(--primary), var(--secondary));
      color: white;
      z-index: 10;
      transition: opacity var(--transition) ease;
    }

    #logo {
      width: 120px;
      height: 120px;
      background: var(--accent);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
    }

    #startBtn {
      padding: 14px 34px;
      font-size: 1.2rem;
      border: none;
      border-radius: 12px;
      background: var(--accent);
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
      transition: transform 0.2s ease, background 0.2s ease;
    }
    #startBtn:hover {
      background: var(--secondary);
      color: white;
      transform: scale(1.05);
    }

    /* Curtain */
    .curtain {
      position: fixed;
      top: 0;
      width: 50%;
      height: 100vh;
      background: var(--primary);
      z-index: 9;
      transition: transform var(--transition);
    }
    .left-curtain { left: 0; transform: translateX(0); }
    .right-curtain { right: 0; transform: translateX(0); }

    .open .left-curtain { transform: translateX(-100%); }
    .open .right-curtain { transform: translateX(100%); }

    /* Main UI */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 40px;
      background: var(--primary);
      color: white;
    }

    #themeToggle {
      padding: 8px 16px;
      border: none;
      border-radius: 8px;
      background: var(--accent);
      color: var(--primary);
      font-weight: 600;
      cursor: pointer;
    }

    main {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px;
      padding: 40px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    .show-main main { opacity: 1; }

.test-box {
  background: var(--primary);
  color: white;
  padding: 40px;
  border-radius: 16px;
  cursor: pointer;
  transition: all 0.3s ease;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.2rem;
  font-weight: bold;
  position: relative;
  overflow: hidden;
}

/* Create a pseudo element for hover text */
.test-box::after {
  content: "Attempt Test";
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  background: var(--secondary);
  opacity: 0;
  transition: opacity 0.3s ease;
}

/* Hide main text and show hover text */
.test-box:hover {
  background: var(--secondary);
}

.test-box:hover::after {
  opacity: 1;
}

.test-box:hover {
  color: transparent; /* hides the original text when hovered */
}
  </style>
</head>
<body>
  <!-- Welcome Screen -->
  <section id="welcome">
    <div id="logo">LOGO</div>
    <h1>Welcome to the Mock Test Arena</h1>
    <p style="margin:10px 0 30px 0">Prepare. Practice. Perform.</p>
    <button id="startBtn">Start Mock Tests</button>
  </section>

  <!-- Curtains -->
  <div class="curtain left-curtain"></div>
  <div class="curtain right-curtain"></div>

  <!-- Main Screen -->
  <div id="app">
    <header>
      <div style="font-weight:700">LOGO</div>
      <button id="themeToggle">Toggle Theme</button>
    </header>
    <main id="testGrid"></main>
  </div>

  <script>
    const startBtn = document.getElementById('startBtn');
    const welcome = document.getElementById('welcome');
    const body = document.body;
    const testGrid = document.getElementById('testGrid');
    const themeToggle = document.getElementById('themeToggle');

    // Create test boxes
    const totalTests = 10;
    for (let i = 1; i <= totalTests; i++) {
      const box = document.createElement('div');
      box.className = 'test-box';
      box.textContent = `Mock Test ${i}`;
      box.addEventListener('click', () => alert(`Starting Mock Test ${i}...`));
      testGrid.appendChild(box);
    }

    // Curtain animation
    startBtn.addEventListener('click', () => {
      body.classList.add('open');
      setTimeout(() => {
        welcome.style.opacity = 0;
        setTimeout(() => {
          welcome.style.display = 'none';
          body.classList.add('show-main');
        }, 600);
      }, 200);
    });

    // Theme toggle
    const userPref = localStorage.getItem('theme') || 'auto';
    if (userPref === 'dark' || (userPref === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.setAttribute('data-theme', 'dark');
    }

    themeToggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      if (current === 'dark') {
        document.documentElement.removeAttribute('data-theme');
        localStorage.setItem('theme', 'light');
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        localStorage.setItem('theme', 'dark');
      }
    });
  </script>
</body>
</html>

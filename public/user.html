  <script>

    //text effect
        const h1 = document.getElementById('headline');
    const p = document.getElementById('subtext');
    const text = "Welcome to International English Language Testing System Mock Test";
    const words = text.split(" ");
    let currentWordIndex = 0;
    let showing = true; // typing or deleting
    let displayWords = [];
    const typingSpeed = 30; // ms per word
    const pauseTime = 2000; // pause before deleting
    const fadeTime = 1000; // fade duration for <p>

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    async function typeDeleteLoop() {
      while (true) {
        // TYPE PHASE
        for (let i = 1; i <= text.length; i++) {
          h1.textContent = text.slice(0, i);
          await sleep(typingSpeed);
        }

        // when typing finished → show <p>
        p.style.opacity = 1;
        await sleep(1000); // stay visible 1s
        p.style.opacity = 0;

        // Pause before deleting
        await sleep(pauseTime);

        // DELETE PHASE
        for (let i = text.length; i >= 0; i--) {
          h1.textContent = text.slice(0, i);
          await sleep(typingSpeed);
        }

        // small pause before retyping
        await sleep(500);
      }
    }

    window.onload = typeDeleteLoop;


    const startBtn = document.getElementById('startBtn');
    const welcome = document.getElementById('welcome');
    const body = document.body;
    const menuContainer = document.getElementById('menuContainer');
    const themeToggle = document.getElementById('themeToggle');

    const totalTests = 10;

    // === NEW FUNCTION: mode selection screen ===
function renderModeSelection() {
  menuContainer.innerHTML = '<h1>Select a Mode</h1>';
  menuContainer.className = 'menu-container';

  const modes = ['Academic', 'General Training'];
  modes.forEach(mode => {
    const modeBox = document.createElement('div');
    modeBox.className = 'mini-test-box';
    modeBox.classList.add("mode-button");
    modeBox.textContent = mode;
    modeBox.addEventListener('click', () => renderMenu(mode));
    menuContainer.appendChild(modeBox);
  });
}

// === EXISTING: render the 10 mock tests (now includes mode param) ===
function renderMenu(selectedMode) {
  menuContainer.innerHTML = '';
  menuContainer.className = 'menu-container';
  const numberOfTests = selectedMode == "General Training" ? "NO TESTS": 12;
  
  if(numberOfTests == "NO TESTS"){
    menuContainer.textContent = "NO TESTS AVAILABLE RIGHT NOW."
  }else{
    for (let i = 1; i <= numberOfTests; i++) {
    const miniBox = document.createElement('div');
    miniBox.className = 'mini-test-box';
    miniBox.textContent = `Mock Test ${i}`;
    miniBox.addEventListener('click', () => expandTest(miniBox, i, selectedMode));
    menuContainer.appendChild(miniBox);
  }
  }
  

  // Back button to go back to mode selection
  const backBtn = document.createElement('button');
  backBtn.className = 'backBtn';
  backBtn.textContent = 'Back';
  backBtn.addEventListener('click', renderModeSelection);
  menuContainer.appendChild(backBtn);
}

    // === EXPANDED VIEW ===
function expandTest(box, testNum, mode) {
  menuContainer.innerHTML = '';
  menuContainer.className = 'menu-container expanded';

  const expandedBox = document.createElement('div');
  expandedBox.textContent = `Mock Test ${testNum}`;
  expandedBox.style.color = '#380169';

  const attemptBtn = document.createElement('button');
  attemptBtn.id = 'attemptBtn';
  attemptBtn.textContent = 'Attempt Test';
  attemptBtn.addEventListener('click', () => goToMock(testNum, mode));

  const backBtn = document.createElement('button');
  backBtn.className = 'backBtn';
  backBtn.textContent = 'Back';
  backBtn.addEventListener('click', () => renderMenu(mode));

  menuContainer.append(expandedBox, attemptBtn, backBtn);
}

    // Curtain animation
    startBtn.addEventListener('click', () => {
      body.classList.add('open');
      setTimeout(() => {
        welcome.style.opacity = 0;
        setTimeout(() => {
          welcome.style.display = 'none';
          body.classList.add('show-main');
          renderModeSelection(); // <-- NEW ENTRY POINT
}, 200);
})});








// === NAVIGATION ===
function goToMock(mockID, mode) {
  window.location.href = `/passcodes?mockID=${mode}-UKA-FINAL-${mockID}`;
}
</script>
